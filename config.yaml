app:
  name: "Girivinity"
  environment: "dev"
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  structured_logging: true
  auto_load_model: false

model:
  model_id: "models/base"
  device_map: "auto"
  torch_dtype: "float16"
  load_in_4bit: true
  kv_cache: true
  base_model_path: "models/base"
  quantised_path: "models/girivinity_quantised/girivinity-q4_k_m.gguf"
  n_ctx: 4096
  n_gpu_layers: 0
  architecture:
  dim: 3072
  n_layers: 28
  n_heads: 24
  n_kv_heads: 8
  vocab_size: 32000
  max_seq_len: 4096
  ffn_multiplier: 2.667
  norm_eps: 0.00001
  rope_theta: 500000.0

rag:
  chroma_path: "data/chroma"

crawler:
  max_depth: 2
  concurrent_requests: 32
  download_timeout_seconds: 15
  trust_threshold: 0.6
  obey_robots_txt: true

training:
  queue_db: "data/training_queue.sqlite3"
  check_interval_minutes: 30
  min_batch_size: 50
  epochs: 3
  min_validation_samples: 1
  min_benchmark_delta: 0.0
  max_training_epochs: 1
  require_validation_dataset: true
  require_benchmark_improvement: true

security:
  require_grounding: true
  require_trusted_crawler_urls: true
  prompt_max_chars: 12000
  allow_remote_code: false

feature_flags:
  enable_rag: true
  enable_crawler: true
  enable_training: true
  enable_multimodal: false
  enable_analytics: true

modules:
  core:
    enabled: true
    config_source: "config.yaml"
  llm:
    enabled: true
    model_id: "models/base"
    device_map: "auto"
    trust_remote_code: false
    attn_implementation: "sdpa"
    torch_dtype: "float16"
    kv_cache: true
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: "float16"
  memory:
    enabled: true
    backend: "faiss"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    embedding_dim: 384
    short_term_limit: 50
  agents:
    enabled: true
    default_route:
      - "research_agent"
      - "reasoning_agent"
      - "critic_agent"
  crawler:
    enabled: true
    obey_robots_txt: true
    concurrent_requests: 32
    max_depth: 2
    trust_threshold: 0.6
  rag:
    enabled: true
    top_k: 4
    max_context_chars: 2500
    require_sources: true
  security:
    enabled: true
    require_grounding: true
    require_validation_for_training: true
    require_benchmark_improvement: true
  analytics:
    enabled: true
    sink: "in_memory"
  multimodal:
    enabled: true
    text: true
    images: false
    audio: false
  training:
    enabled: true
    method: "lora"
    require_validation_dataset: true
    require_benchmark_improvement: true
    min_benchmark_delta: 0.0
  self_training:
    interval_seconds: 1800
    chunk_threshold: 50
    base_model_path: "models/base"
    adapters_dir: "models/adapters"
    training_queue_dir: "data/training_queue"
    event_log_path: "logs/self_training.jsonl"
    alerts_log_path: "logs/alerts.jsonl"
    epochs: 3
    learning_rate: 0.0002
    loss_abort_threshold: 2.0

self_training:
  interval_seconds: 1800
  chunk_threshold: 50
  pending_collection: "pending_training"
  trained_collection: "trained"
  chroma_path: null
  training_queue_dir: "data/training_queue"
  event_log_path: "logs/self_training.jsonl"
  alerts_log_path: "logs/alerts.jsonl"
  base_model_path: "models/base"
  quantised_path: "models/girivinity_quantised/girivinity-q4_k_m.gguf"
  n_ctx: 4096
  n_gpu_layers: 0
  latest_adapter_path: "models/adapters/latest"
  adapters_dir: "models/adapters"
  epochs: 5
  learning_rate: 0.0002
  loss_abort_threshold: 2.0
  batch_size: 2
  max_length: 1024


successor_engine:
  check_interval_seconds: 86400
  chunk_threshold: 100000
  quality_threshold: 3.5
  feedback_window: 1000
  trained_collection: "trained"
  chroma_path: null
  feedback_db_path: "data/user_feedback.sqlite3"
  training_root: "data/successor_training"
  versions_dir: "models/versions"
  active_model_symlink: "models/active"
  notifications_path: "admin_notifications.jsonl"
  state_path: "data/successor_state.json"
  batch_size: 2
  epochs: 1
  learning_rate: 0.0002
  train_seq_len: 256
  eval_split: 0.1
  device: "cpu"


skill_forge:
  skills_dir: skills
  db_path: data/skill_forge.db
  min_chunks_to_generate: 3
  max_skills_composed: 3


cuda_engine:
  nvcc_path: nvcc
  cuda_std: c++17
  arch: sm_80
  max_compile_retries: 3
  kernels_dir: data/cuda_kernels
