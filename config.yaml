# ============================================================
# GIRIVINITY — MASTER CONFIGURATION
# ============================================================

app:
  name: "Girivinity"
  version: "3.0.0"
  environment: "production"
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"
  structured_logging: true
  auto_load_model: false

# ============================================================
# MODEL — Hardware-adaptive, generation-aware
# ============================================================
model:
  # Set true after running model/train.py to use Girivinity's own weights
  use_native_model: false
  # Path to a saved GirivinityModel checkpoint directory (config.json + pytorch_model.bin + tokenizer.json).
  native_model_path: ""
  # Set to 'girivinity-native' to use own trained model, or a HuggingFace model_id for the HF path
  model_id: "girivinity-native"
  device_map: "auto"
  n_gpu_layers: -1                 # -1 = all layers on GPU if VRAM sufficient
  n_ctx: 4096
  n_threads: 8
  n_batch: 512
  use_mlock: true
  flash_attention: true
  rope_scaling: "dynamic"

  # Quantization
  torch_dtype: "float16"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"
  kv_cache: true
  trust_remote_code: false
  attn_implementation: "flash_attention_2"

  # Architecture (3B spec, matches model/architecture.py's verified defaults)
  architecture:
    vocab_size: 65536
    max_seq_len: 32768
    dim: 3072
    n_layers: 28
    n_heads: 24
    n_kv_heads: 8
    ffn_multiplier: 2.667
    norm_eps: 0.00001
    rope_theta: 500000.0

  social_adaptability:
    enabled: true
    tone_modes:
      - "formal"
      - "casual"
      - "empathetic"
      - "technical"
      - "instructional"
    auto_detect_tone: true
    adapt_vocabulary_complexity: true

# ============================================================
# SENTIMENT & EMOTION ENGINE
# ============================================================
sentiment:
  enabled: true
  backend: "hybrid"               # vader (fast) + transformer (deep)
  transformer_model: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  emotion_classes:
    - "joy"
    - "sadness"
    - "anger"
    - "fear"
    - "surprise"
    - "disgust"
    - "confusion"
    - "frustration"
    - "curiosity"
    - "urgency"
  crisis_detection: true           # Detect distress signals, escalate carefully
  response_adaptation: true        # Modify response tone based on detected emotion

# ============================================================
# RAG — Embedding-based with hybrid retrieval
# ============================================================
rag:
  backend: "faiss"
  chroma_path: "data/chroma"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384
  top_k: 8
  hybrid_retrieval: true           # Combine dense (FAISS) + sparse (BM25)
  bm25_weight: 0.3
  dense_weight: 0.7
  reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  use_reranker: true
  max_context_chars: 4000
  require_sources: true
  metadata_filters: true           # Filter by source_type, date, domain

# ============================================================
# CYBERSECURITY DOMAIN
# ============================================================
cybersecurity:
  enabled: true
  nvd_api_key: "${NVD_API_KEY}"
  nvd_sync_interval_hours: 6
  mitre_attack_version: "14.1"
  ioc_feeds:
    - "https://feodotracker.abuse.ch/downloads/ipblocklist.csv"
    - "https://urlhaus.abuse.ch/downloads/csv_recent/"
    - "https://threatfox.abuse.ch/export/csv/recent/"
  semgrep_rules: "p/security-audit"
  bandit_severity: "MEDIUM"
  sandbox:
    backend: "docker"
    image: "python:3.11-slim"
    timeout_seconds: 15
    network: "none"
    memory_limit: "128m"
    cpu_quota: 10000

compute:
  # Auto-detects GPU at runtime. Set to "cpu" to force CPU-only mode.
  # Set to "cuda" to require GPU (will error if not available).
  device: "auto"

  # Training settings per device type
  training:
    gpu:
      use_amp: true              # Mixed precision (float16) on GPU
      dataloader_num_workers: 4  # Parallel data loading on GPU
      gradient_checkpointing: true
    cpu:
      use_amp: false             # AMP disabled on CPU
      dataloader_num_workers: 0  # No multiprocessing on CPU
      gradient_checkpointing: true  # Still useful to save RAM on CPU

  # Inference settings
  inference:
    gpu:
      load_in_4bit: true         # 4-bit NF4 quantization on GPU
      torch_dtype: "float16"
    cpu:
      load_in_4bit: false        # No 4-bit on CPU (use GGUF instead)
      torch_dtype: "float32"

compute:
  # Auto-detects GPU at runtime. Set to "cpu" to force CPU-only mode.
  # Set to "cuda" to require GPU (will error if not available).
  device: "auto"

  # Training settings per device type
  training:
    gpu:
      use_amp: true              # Mixed precision (float16) on GPU
      dataloader_num_workers: 4  # Parallel data loading on GPU
      gradient_checkpointing: true
    cpu:
      use_amp: false             # AMP disabled on CPU
      dataloader_num_workers: 0  # No multiprocessing on CPU
      gradient_checkpointing: true  # Still useful to save RAM on CPU

  # Inference settings
  inference:
    gpu:
      load_in_4bit: true         # 4-bit NF4 quantization on GPU
      torch_dtype: "float16"
    cpu:
      load_in_4bit: false        # No 4-bit on CPU (use GGUF instead)
      torch_dtype: "float32"

crawler:
  max_depth: 100
  concurrent_requests: 3200000
  download_timeout_seconds: 20
  trust_threshold: 0.6
  obey_robots_txt: true
  use_playwright: true             # JS-rendered page support
  security_sources_enabled: true

# ============================================================
# TRAINING (LoRA)
# ============================================================
training:
  method: "lora"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  queue_db: "data/training_queue.sqlite3"
  check_interval_minutes: 30
  min_batch_size: 50
  epochs: 3
  learning_rate: 0.0002
  max_length: 1024
  min_validation_samples: 1
  max_training_epochs: 1
  require_validation_dataset: true
  require_benchmark_improvement: true
  pretrain:
    data_path: "data/distillation/output.jsonl"
    output_dir: "models/girivinity_pretrain"
    batch_size: 2
    learning_rate: 0.0003
    warmup_steps: 100
    max_steps: 1000
    gradient_accumulation_steps: 8
    checkpoint_every: 100
    use_amp: true
    use_fsdp: false
    device: "auto"
    model_config:
      vocab_size: 65536
      hidden_dim: 2048
      num_heads: 16
      num_layers: 24
      ffn_dim: 8192
      max_seq_len: 4096
      dropout: 0.1
      use_rope: true
      use_gqa: true
      num_kv_heads: 4
      use_rmsnorm: true

# ============================================================
# SECURITY
# ============================================================
security:
  require_grounding: true
  prompt_max_chars: 16000
  allow_remote_code: false
  require_trusted_crawler_urls: true
  audit_log_path: "logs/audit.jsonl"
  rate_limit_rpm: 60

# ============================================================
# FEATURE FLAGS
# ============================================================
feature_flags:
  enable_rag: true
  enable_crawler: true
  enable_training: true
  enable_multimodal: true
  enable_analytics: true
  enable_cognition: true
  enable_sentiment: true
  enable_cybersecurity: true
  enable_successor_engine: true
  enable_episodic_memory: true

modules:
  core:
    enabled: true
    config_source: "config.yaml"
  llm:
    enabled: true
    model_id: "microsoft/Phi-3-mini-4k-instruct"
    device_map: "auto"
    trust_remote_code: false
    attn_implementation: "flash_attention_2"
    torch_dtype: "float16"
    kv_cache: true
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: "float16"
  memory:
    enabled: true
    backend: "faiss"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    embedding_dim: 384
    short_term_limit: 50
  agents:
    enabled: true
    default_route:
      - "research_agent"
      - "reasoning_agent"
      - "critic_agent"
  crawler:
    enabled: true
    obey_robots_txt: true
    concurrent_requests: 3200000
    max_depth: 100
    trust_threshold: 0.6
  rag:
    enabled: true
    top_k: 8
    max_context_chars: 4000
    require_sources: true
  security:
    enabled: true
    require_grounding: true
    require_validation_for_training: true
    require_benchmark_improvement: true
  analytics:
    enabled: true
    sink: "in_memory"
  multimodal:
    enabled: true
    text: true
    images: true
    audio: true
  training:
    enabled: true
    method: "lora"
    require_validation_dataset: true
    require_benchmark_improvement: true
    min_benchmark_delta: 0.0
  self_training:
    interval_seconds: 1800
    chunk_threshold: 50
    base_model_path: "models/base"
    adapters_dir: "models/adapters"
    training_queue_dir: "data/training_queue"
    event_log_path: "logs/self_training.jsonl"
    alerts_log_path: "logs/alerts.jsonl"
    epochs: 3
    learning_rate: 0.0002
    loss_abort_threshold: 2.0

self_training:
  interval_seconds: 1800
  chunk_threshold: 50
  pending_collection: "pending_training"
  trained_collection: "trained"
  chroma_path: null
  training_queue_dir: "data/training_queue"
  event_log_path: "logs/self_training.jsonl"
  alerts_log_path: "logs/alerts.jsonl"
  base_model_path: "models/base"
  quantised_path: "models/gguf/girivinity-q4_k_m.gguf"
  n_ctx: 4096
  n_gpu_layers: -1
  latest_adapter_path: "models/adapters/latest"
  adapters_dir: "models/adapters"
  epochs: 5
  learning_rate: 0.0002
  loss_abort_threshold: 2.0
  batch_size: 2
  max_length: 1024

skill_forge:
  skills_dir: skills
  db_path: data/skill_forge.db
  min_chunks_to_generate: 3
  max_skills_composed: 3

successor_engine:
  current_generation: 1  # Generation 1 is now Girivinity-3B
  check_interval_seconds: 86400
  chunk_threshold: 100000
  quality_threshold: 3.5
  feedback_window: 1000
  trained_collection: "trained"
  chroma_path: null
  feedback_db_path: "data/user_feedback.sqlite3"
  training_root: "data/successor_training"
  versions_dir: "models/versions"
  active_model_symlink: "models/active"
  notifications_path: "admin_notifications.jsonl"
  state_path: "data/successor_state.json"
  batch_size: 2
  epochs: 1
  learning_rate: 0.0002
  train_seq_len: 256
  eval_split: 0.1
  device: "auto"
  auto_quantize: true        # Quantize successor to GGUF after training
  quant_type: "Q4_K_M"      # Quantization format for CPU inference


skill_forge:
  skills_dir: skills
  db_path: data/skill_forge.db
  min_chunks_to_generate: 3
  max_skills_composed: 3


cuda_engine:
  nvcc_path: nvcc
  cuda_std: c++17
  arch: sm_80
  max_compile_retries: 3
  kernels_dir: data/cuda_kernels

database:
  host: localhost
  port: 5432
  name: girivinity
  user: girivinity
  pool_min_conn: 2
  pool_max_conn: 10
  # password is intentionally NOT set here — see DATABASE_PASSWORD in .env.example.
  # app/core/db.py requires the env var; this file should never hold a real
  # password since it's committed to git.
