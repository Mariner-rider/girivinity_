[project]
name = "girivinity"
version = "0.1.0"
description = "Modular autonomous LLM system"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "bitsandbytes>=0.43.0",
  "accelerate>=0.33.0",
  "prometheus-client>=0.20.0",
  "pyyaml>=6.0.1",
  "numpy>=1.26.0",
  "faiss-cpu>=1.8.0",
  "scrapy>=2.11.2",
  "datasets>=2.20.0",
  "peft>=0.12.0",
  "duckduckgo-search>=6.2.0",
  "httpx>=0.27.0",
  "trafilatura>=1.12.0",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "llama-cpp-python>=0.2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "integration: tests that require live network and optional external services",
]
